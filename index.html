<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Recreate any photo: line up your shot against a ghost overlay of the reference. Everything stays on your device." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ghostframe" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Ghostframe</title>
  </head>
  <body>
    <!-- ───────────── Setup ───────────── -->
    <main id="setup" class="screen setup">
      <header class="brand">
        <img src="./favicon.svg" alt="" width="40" height="40" />
        <h1>Ghostframe</h1>
      </header>
      <p class="tagline">Pick a photo you want to recreate. It will float over your camera so you can line up the shot.</p>

      <label class="picker" id="picker">
        <input id="file" type="file" accept="image/*,.heic,.heif" class="visually-hidden" />
        <img id="preview" alt="Selected reference image" hidden />
        <span class="picker-empty" id="picker-empty">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16l4.5-4.5 3 3L16 10l4 4M4 5h16v14H4z" /><circle cx="8.5" cy="8.5" r="1.5" /></svg>
          <strong>Choose reference image</strong>
          <small>Anime scene, influencer shot, old family photo…</small>
        </span>
        <span class="picker-change" id="picker-change" hidden>Tap to change</span>
      </label>

      <p class="setup-error" id="setup-error" role="alert" hidden></p>

      <button id="open-camera" class="btn-primary" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h3l2-3h8l2 3h3v12H3z" /><circle cx="12" cy="13.5" r="3.5" /></svg>
        Open camera
      </button>

      <p class="privacy">Your images never leave this device. No uploads, no accounts, no tracking.</p>
    </main>

    <!-- ───────────── Viewfinder ───────────── -->
    <section id="viewer" class="screen viewer" hidden aria-label="Viewfinder">
      <div
        id="stage-wrap"
        class="stage-wrap"
        tabindex="0"
        role="application"
        aria-label="Viewfinder. Drag to move the reference, pinch or scroll to resize, double-tap to reset. Arrow keys move, plus and minus resize, 0 resets."
      >
        <div id="stage" class="stage">
          <video id="video" playsinline muted autoplay disablepictureinpicture></video>
          <canvas id="still" hidden></canvas>
          <div id="overlay" class="overlay" aria-hidden="true">
            <img id="overlay-photo" alt="" draggable="false" />
            <canvas id="overlay-lines" hidden></canvas>
          </div>
          <div id="flash" class="flash" aria-hidden="true"></div>
        </div>
        <p id="hint" class="hint" hidden>Drag to move, pinch to resize, double-tap to reset</p>

        <div id="cam-message" class="cam-message" role="alert" hidden>
          <h2 id="cam-message-title"></h2>
          <div id="cam-message-body"></div>
          <div class="cam-message-actions">
            <button id="cam-retry" type="button" class="btn-primary">Try again</button>
            <button id="cam-back" type="button" class="btn-secondary">Back</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="topbar">
          <button id="back" type="button" class="icon-btn" aria-label="Back to image selection">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <label class="lens" id="lens-wrap" hidden>
            <span class="visually-hidden">Camera lens</span>
            <select id="lens"></select>
          </label>
          <span class="spacer"></span>
          <div class="segmented" role="radiogroup" aria-label="Overlay style">
            <button type="button" role="radio" aria-checked="true" id="mode-photo">Photo</button>
            <button type="button" role="radio" aria-checked="false" id="mode-lines">Lines</button>
          </div>
          <button id="mirror" type="button" class="icon-btn" aria-label="Mirror reference" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M9 7L3 17h6zM15 7l6 10h-6z" /></svg>
          </button>
        </div>

        <div class="sliders">
          <div class="slider-row">
            <button id="peek" type="button" class="icon-btn small" aria-label="Hold to hide reference">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c5 0 9 5 9 7a9 9 0 0 1-2.4 3.4M6.1 6.9C4 8.3 3 10.6 3 12c0 2 4 7 9 7 1.7 0 3.2-.5 4.6-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2" /></svg>
            </button>
            <label for="opacity" class="slider-label">Opacity</label>
            <input id="opacity" type="range" min="0" max="100" step="1" value="40" />
            <output id="opacity-val" for="opacity">40%</output>
          </div>
          <div class="slider-row" id="zoom-row" hidden>
            <span class="icon-slot" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6" /></svg>
            </span>
            <label for="zoom" class="slider-label">Zoom</label>
            <input id="zoom" type="range" />
            <output id="zoom-val" for="zoom">1.0×</output>
          </div>
        </div>

        <div class="bottom">
          <div id="live-controls" class="live-controls">
            <button id="shutter" type="button" class="shutter" aria-label="Take photo" aria-keyshortcuts="Space"></button>
          </div>
          <div id="review-controls" class="review-controls" hidden>
            <button id="retake" type="button" class="action">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4" /></svg>
              <span>Retake</span>
            </button>
            <button id="save-photo" type="button" class="action primary">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>
              <span>Save photo</span>
            </button>
            <button id="save-compare" type="button" class="action">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="8" height="14" rx="1" /><rect x="13" y="5" width="8" height="14" rx="1" /></svg>
              <span>Save comparison</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
